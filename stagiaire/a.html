<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#f4f6f9;
}

.login-page{
    display:flex;
    height:100vh;
}

/* ===========================
        PARTIE GAUCHE
=========================== */

.left-panel{

    width:50%;

    background:#111;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    overflow:hidden;
}

.left-panel img{

    width:70%;

    max-width:520px;
}

.left-text{

    position:absolute;

    bottom:50px;

    left:50px;

    color:white;
}

.left-text h1{

    font-size:50px;

    line-height:1.15;

    margin-bottom:20px;
}

.left-text p{

    font-size:18px;

    color:#d8d8d8;
}

/* ===========================
        PARTIE DROITE
=========================== */

.right-panel{

    width:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#fafafa;
}

/* ===========================
          CARD
=========================== */

.login-card{

    width:440px;

    background:white;

    padding:45px;

    border-radius:20px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.08);

    transition:.3s;
}

.login-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 25px 60px rgba(0,0,0,.12);
}

.login-card h2{

    text-align:center;

    font-size:40px;

    margin-bottom:10px;
}

.login-card p{

    text-align:center;

    color:#666;

    margin-bottom:35px;
}

/* ===========================
          FORM
=========================== */

.input-group{

    margin-bottom:22px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;
}

input{

    width:100%;

    height:55px;

    border:1px solid #d8dce3;

    border-radius:12px;

    padding:0 18px;

    font-size:16px;

    outline:none;

    transition:.25s;
}

input:focus{

    border-color:#78B3A6;

    box-shadow:0 0 0 4px rgba(120,179,166,.20);
}

/* ===========================
          BUTTON
=========================== */

button{

    width:100%;

    height:55px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:17px;

    font-weight:bold;

    color:white;

    background:linear-gradient(
        90deg,
        #78B3A6,
        #5E7F89,
        #454A67
    );

    transition:.25s;
}

button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(69,74,103,.30);
}

button:active{

    transform:scale(.98);
}

</style>

</head>

<body>

<div class="login-page">

    <!-- Partie gauche -->

    <div class="left-panel">

        <img src="login-banner.jpeg" alt="Logo">

        <div class="left-text">

            <h1>
                Plateforme de gestion<br>
                des stagiaires
            </h1>

            <p>
                Suivez, encadrez et évaluez vos stagiaires en un seul endroit.
            </p>

        </div>

    </div>

    <!-- Partie droite -->

    <div class="right-panel">

        <div class="login-card">

            <h2>Bienvenue</h2>

            <p>
                Connectez-vous pour accéder à votre espace
            </p>

            <form>

                <div class="input-group">

                    <label>Adresse email</label>

                    <input
                        type="email"
                        placeholder="admin@test.com">

                </div>

                <div class="input-group">

                    <label>Mot de passe</label>

                    <input
                        type="password"
                        placeholder="********">

                </div>

                <button>
                    Se connecter
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
